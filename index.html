<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TinyCode 终端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <div class="editor-pane">
      <div class="header">编辑器 <button id="run">运行</button> <button id="clear">清空输出</button></div>
      <textarea id="code" spellcheck="false">print("Hello TinyCode!")</textarea>
    </div>
    <div class="output-pane">
      <div class="header">输出</div>
      <div id="output"></div>
    </div>
  </div>
  <footer>基于 Pyodide | <a href="https://github.com/mk145mc/TinyCode">GitHub</a></footer>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
